name: Regression (a11y + visual)

# Manual-only gate. Hit the 20-min job timeout the only time we wired it
# to `push: [qa]` (PR #102) — the a11y audit alone runs ~10 min for 118
# pages × light/dark, which is fine locally but unreliable in CI. The
# canonical pre-release gate is `pnpm regression` on the maintainer's
# machine; this workflow is kept on `workflow_dispatch` so artifacts
# (playwright-report, a11y-report) can be uploaded when remote logs are
# wanted. Don't add a push trigger without parallelizing the a11y audit
# first.
on:
  workflow_dispatch:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: A11y + Visual regression
    runs-on: ubuntu-latest
    # a11y audit ~3-5 min (118 component pages × light+dark axe scans)
    # visual regression ~2-3 min (118 screenshots compared against baselines)
    # plus install + build overhead. 20 leaves headroom.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build registry
        run: pnpm run build:registry

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/docs/package.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter docs exec playwright install --with-deps chromium

      # Spawns `next start` on port 3010, scans every component page in
      # light + dark with axe-core, exits non-zero on critical/serious
      # violations (the script's default failOn). Self-managed server
      # lifecycle — no separate boot/teardown step needed.
      - name: Accessibility audit
        run: pnpm a11y-audit
        env:
          CI: "1"

      # Playwright screenshots every component page in light + dark,
      # compares against committed baselines under
      # apps/docs/e2e/visual.spec.ts-snapshots/. No external service —
      # a diff fails the job; the playwright-report/ artifact lets the
      # maintainer download an HTML diff viewer.
      - name: Visual regression
        run: pnpm --filter docs test:visual
        env:
          CI: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/docs/playwright-report/
          retention-days: 14

      - name: Upload a11y report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            a11y-report.json
            a11y-report.md
          retention-days: 14
