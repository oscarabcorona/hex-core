name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Lock the token to read-only — CI doesn't need write access.
permissions:
  contents: read

jobs:
  build:
    name: Lint / Build / Test
    runs-on: ubuntu-latest
    # Was 5; the a11y-audit step alone takes ~3-5 min (118 page scans × light+dark)
    # and the visual regression adds ~2-3 min. 20 leaves headroom without going wild.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build packages
        run: pnpm build

      - name: Build registry
        run: pnpm run build:registry

      - name: Verify @hex-core/mcp README is in sync with clients.ts
        run: git diff --exit-code packages/mcp-server/README.md

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/docs/package.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Unit + E2E tests
        run: pnpm test
        env:
          CI: "1"

      # Spawns `next start` on port 3010, scans every component page in
      # light + dark with axe-core, exits non-zero on critical/serious
      # violations (the script's default failOn). The script handles its
      # own server lifecycle — no separate boot/teardown step needed.
      - name: Accessibility audit
        run: pnpm a11y-audit
        env:
          CI: "1"

      # Visual regression — Playwright screenshots every component page in
      # light + dark, compares against committed baselines under
      # apps/docs/e2e/visual.spec.ts-snapshots/. No external service: a
      # diff fails the job; the playwright-report/ artifact lets reviewers
      # download an HTML diff viewer.
      - name: Visual regression
        run: pnpm --filter docs test:visual
        env:
          CI: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/docs/playwright-report/
          retention-days: 14
