name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Lock the token to read-only — CI doesn't need write access.
permissions:
  contents: read

# Three independent parallel jobs. Lint surfaces in <30s; build runs
# its own readme-sync check; test re-builds packages locally and runs
# the suite. Wall-clock is set by the slowest job (test). Build is run
# twice (once in `build`, once in `test`) — accepted as the cost of
# parallel scheduling; remote turbo cache could remove the duplication
# later. The slow regression suite (a11y + visual) lives in its own
# workflow at regression.yml — workflow_dispatch only; the canonical
# pre-release gate is `pnpm regression` run locally.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Build registry
        run: pnpm run build:registry
      # The mcp build's prebuild step regenerates packages/mcp-server/README.md
      # from clients.ts. If anyone edited the source without re-running build,
      # the diff against the committed README catches the drift.
      - name: Verify @hex-core/mcp README is in sync with clients.ts
        run: git diff --exit-code packages/mcp-server/README.md
      # registry/ is generated by build:registry and committed. Scoping this to
      # graph.json alone missed example-only edits, which never reach the
      # graph — exactly the class of defect PR #227 fixed.
      - name: Verify the generated registry is in sync with the schemas
        run: git diff --exit-code registry
      # Schema-quality gate. ERROR tier only (structural lies in the ai
      # block: placeholder prose, unresolvable slugs, missing examples);
      # coverage metrics print as non-gating warnings. Runs in seconds
      # against the committed registry.
      - name: Verify schema quality
        run: pnpm run verify:schema-quality
      # The barrels and the docs colour layer are generated by `pnpm build`
      # from the filesystem and from packages/tokens. They are committed so
      # the tree typechecks without a build step; this gate is what keeps
      # "generated" from quietly meaning "hand-edited once and forgotten" —
      # the failure mode that left 53 schemas out of the old hand-written
      # barrel.
      #
      # A GLOB, not a list. The list form shipped with four of the five files
      # on it: `packages/themes/src/presets/briefs.generated.ts` was missing,
      # so adding a preset brief without re-running `pnpm build` passed this
      # gate AND the themes suite (which only asserts two hardcoded slugs),
      # and `loadThemeBrief` returns undefined for the missing one. A gate
      # that has to be extended by hand for each new generated file is the
      # same hand-maintained list this PR exists to delete.
      #
      # `git diff` covers tracked drift; the porcelain check covers a
      # generator emitting a NEW file nobody committed, which `git diff`
      # cannot see.
      - name: Verify the generated barrels and tokens are in sync
        run: |
          git diff --exit-code -- '*.generated.*'
          untracked="$(git ls-files --others --exclude-standard -- '*.generated.*')"
          if [ -n "$untracked" ]; then
            echo "::error::Generated files exist that were never committed:"
            echo "$untracked"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Re-run build here because vitest + the docs e2e need package
      # dist/ output. Turbo's local cache is cold across jobs without a
      # remote cache, so this is a real ~30s rebuild — accepted in
      # exchange for early lint feedback in the parallel `lint` job.
      - name: Build packages
        run: pnpm build
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile, not apps/docs/package.json: the pin there is
          # a caret range, so a resolved-version bump inside it needs a new
          # chromium build while leaving package.json byte-identical. That hits
          # the stale cache, skips the install below, and fails the suite with
          # "Executable doesn't exist at .../chromium_headless_shell-<n>".
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter docs exec playwright install --with-deps chromium
      - name: Unit + E2E tests
        run: pnpm test
        env:
          CI: "1"

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # HIGH/CRITICAL surface only, scoped to runtime deps. continue-on-error
      # so a transitive advisory with no upstream patch doesn't block every
      # merge — the job still reports red in the PR check, just non-gating.
      # Triage lower-severity items via Dependabot PRs.
      - name: pnpm audit
        continue-on-error: true
        run: pnpm audit --audit-level=high --prod
