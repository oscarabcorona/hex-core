name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Lock the token to read-only — CI doesn't need write access.
permissions:
  contents: read

jobs:
  build:
    name: Lint / Build / Test
    runs-on: ubuntu-latest
    # 15min was tight once the a11y-audit step (47 components × light+dark)
    # was added after lint/build/test. CI runners hit ~10-12min for the audit
    # alone (vs ~3min locally on M-series) due to slower per-page Next compile.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build packages
        run: pnpm build

      - name: Build registry
        run: pnpm run build:registry

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/docs/package.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Unit + E2E tests
        run: pnpm test
        env:
          CI: "1"

      - name: A11y audit (axe-core, all component demos, light + dark)
        run: pnpm run a11y-audit
        env:
          CI: "1"

      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            a11y-report.json
            a11y-report.md
          if-no-files-found: ignore
