<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Hex theme browser</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #fafafa;
				--fg: #18181b;
				--muted: #71717a;
				--card: #ffffff;
				--border: #e4e4e7;
				--accent: #18181b;
				--accent-fg: #fafafa;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #111113;
					--fg: #f4f4f5;
					--muted: #a1a1aa;
					--card: #1b1b1f;
					--border: #2e2e33;
					--accent: #f4f4f5;
					--accent-fg: #111113;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--fg);
				font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			#root {
				display: flex;
				flex-direction: column;
				height: 100vh;
			}
			header {
				display: flex;
				gap: 12px;
				align-items: center;
				padding: 12px 16px;
				border-bottom: 1px solid var(--border);
			}
			header h1 {
				font-size: 15px;
				margin: 0;
				font-weight: 600;
			}
			header input {
				flex: 1;
				max-width: 320px;
				margin-left: auto;
				padding: 6px 10px;
				border: 1px solid var(--border);
				border-radius: 8px;
				background: var(--card);
				color: var(--fg);
				font: inherit;
			}
			main {
				display: flex;
				flex: 1;
				min-height: 0;
			}
			#cards {
				flex: 1;
				overflow-y: auto;
				margin: 0;
				padding: 12px;
				list-style: none;
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
				gap: 10px;
				align-content: start;
			}
			.card {
				text-align: left;
				width: 100%;
				padding: 12px;
				border: 1px solid var(--border);
				border-radius: 10px;
				background: var(--card);
				color: var(--fg);
				font: inherit;
				cursor: pointer;
				transition: border-color 0.15s ease-out;
			}
			.card:hover,
			.card.selected {
				border-color: var(--muted);
			}
			.card .name {
				font-weight: 600;
				display: block;
			}
			.card .category {
				color: var(--muted);
				font-size: 12px;
			}
			.card .desc {
				display: block;
				margin-top: 4px;
				color: var(--muted);
				font-size: 12px;
				overflow: hidden;
				display: -webkit-box;
				-webkit-line-clamp: 2;
				-webkit-box-orient: vertical;
			}
			#detail {
				width: 320px;
				border-left: 1px solid var(--border);
				padding: 16px;
				overflow-y: auto;
			}
			#detail h2 {
				margin: 0 0 4px;
				font-size: 15px;
			}
			#detail .desc {
				color: var(--muted);
				font-size: 12px;
				margin: 0 0 12px;
			}
			.mode-label {
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				color: var(--muted);
				margin: 12px 0 6px;
			}
			.swatches {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
				gap: 6px;
			}
			.swatch {
				border: 1px solid var(--border);
				border-radius: 8px;
				overflow: hidden;
			}
			.swatch .chip {
				height: 28px;
			}
			.swatch .label {
				display: block;
				padding: 3px 5px;
				font-size: 10px;
				color: var(--muted);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			#use-theme {
				width: 100%;
				margin-top: 16px;
				padding: 8px 12px;
				border: 0;
				border-radius: 8px;
				background: var(--accent);
				color: var(--accent-fg);
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
			#status {
				margin-top: 8px;
				font-size: 12px;
				color: var(--muted);
				word-break: break-all;
			}
			.empty {
				padding: 24px;
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<div id="root">
			<header>
				<h1>Hex themes</h1>
				<input id="filter" type="search" placeholder="Filter by name, category, tag…" />
			</header>
			<main>
				<ul id="cards">
					<li class="empty">Loading themes…</li>
				</ul>
				<aside id="detail" hidden>
					<h2 id="detail-name"></h2>
					<p id="detail-desc" class="desc"></p>
					<div class="mode-label">Light</div>
					<div id="swatches-light" class="swatches"></div>
					<div class="mode-label">Dark</div>
					<div id="swatches-dark" class="swatches"></div>
					<button id="use-theme" type="button">Use this theme</button>
					<div id="status"></div>
				</aside>
			</main>
		</div>
		<!-- @generated:app-bundle -->
	</body>
</html>
